<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Politica de Confidențialitate — High Contrast Large Retro CLR</title>
<style>
:root {
    color-scheme: light dark;
    --bg-page: #f5f3ee;
    --bg-card: #ffffff;
    --fg: #1a1a1a;
    --fg-soft: #525252;
    --fg-muted: #8a8a8a;
    --accent: #d4a017;
    --accent-soft: #fff7d6;
    --accent-bar: #1a1a1a;
    --rule: #ece8df;
    --shadow: 0 8px 32px rgba(20, 18, 12, 0.06), 0 2px 6px rgba(20, 18, 12, 0.04);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-page: #0a0a0a;
        --bg-card: #161412;
        --fg: #f3f1ec;
        --fg-soft: #c7c4bd;
        --fg-muted: #7d7a72;
        --accent: #ffcc00;
        --accent-soft: #2a2206;
        --accent-bar: #ffcc00;
        --rule: #2a2622;
        --shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
    }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: var(--bg-page);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding: 32px 16px 64px;
}

main {
    max-width: 760px;
    margin: 0 auto;
}

.eyebrow {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin: 0 0 12px;
    padding-left: 14px;
    border-left: 3px solid var(--accent);
}

h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.25rem);
    line-height: 1.15;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
    font-weight: 800;
}

.updated {
    color: var(--fg-muted);
    font-size: 0.875rem;
    margin: 0 0 32px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.updated::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
}

.card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 40px;
    box-shadow: var(--shadow);
    border: 1px solid var(--rule);
}

.intro {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 0 0 36px;
    color: var(--fg);
    font-size: 1.02rem;
}
.intro p { margin: 0; }

section {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 18px;
    padding: 22px 0;
    border-top: 1px solid var(--rule);
}
section:first-of-type { border-top: none; padding-top: 4px; }
section:last-of-type { padding-bottom: 4px; }

.num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent-bar);
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    flex-shrink: 0;
}

h2 {
    font-size: 1.1rem;
    margin: 0 0 6px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--fg);
}

p {
    margin: 0 0 8px;
    color: var(--fg-soft);
}
p:last-child { margin-bottom: 0; }

a {
    color: var(--fg);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
